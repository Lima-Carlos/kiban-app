name: kiban-app

# Shared settings for app, worker and scheduler (same image)
x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: kiban-app-php:dev
  restart: unless-stopped
  volumes:
    - ./:/var/www/html
    - vendor:/var/www/html/vendor
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  # Development: reaches the Core running on this computer (http://host.docker.internal:8080)
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - app

services:
  app:
    <<: *app
    container_name: kibanapp-php

  worker:
    <<: *app
    container_name: kibanapp-worker
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    profiles: ["full"]

  scheduler:
    <<: *app
    container_name: kibanapp-scheduler
    command: php artisan schedule:work
    profiles: ["full"]

  nginx:
    image: nginx:1.27-alpine
    container_name: kibanapp-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app

  db:
    image: postgres:18-alpine
    container_name: kibanapp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kiban_app}
      POSTGRES_USER: ${DB_USERNAME:-kiban}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  redis:
    image: redis:7-alpine
    container_name: kibanapp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${FORWARD_REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app

volumes:
  pgdata:
  redisdata:
  vendor:

networks:
  app:
